name: E2E

# Builds the Windows app and drives it end to end: the real app, the real
# coucou-hook relay over the named pipe, real clicks on the island. Uploads the
# screenshots and the log as an artifact. Publishes nothing.

on:
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/target
          key: e2e-windows-cargo-${{ hashFiles('windows/Cargo.lock') }}
          restore-keys: e2e-windows-cargo-

      - run: npm ci
      - name: Build
        run: npx tauri build --no-bundle
      - name: Unit tests
        run: cargo test --workspace
      - name: End to end
        shell: pwsh
        run: ./scripts/e2e/windows.ps1 -Bin target/release/coucou.exe -Out e2e-out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-windows
          path: windows/e2e-out
